name: Build and release VST3

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            artifact: Superformula-Reverb-Windows-x64
          - name: macOS Universal
            os: macos-latest
            artifact: Superformula-Reverb-macOS-Universal

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S . -B out

      - name: Configure macOS Universal
        if: runner.os == 'macOS'
        shell: bash
        run: cmake -S . -B out -G Xcode "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Build
        run: cmake --build out --config Release --parallel 4

      - name: Test
        run: ctest --test-dir out -C Release --output-on-failure

      - name: Verify macOS compatibility
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bundle="out/SuperformulaReverb_artefacts/Release/VST3/Superformula Reverb.vst3"
          binary="$bundle/Contents/MacOS/Superformula Reverb"
          test "$(plutil -extract LSMinimumSystemVersion raw "$bundle/Contents/Info.plist")" = "11.0"
          lipo -archs "$binary" | grep -q 'arm64'
          lipo -archs "$binary" | grep -q 'x86_64'
          test "$(otool -l "$binary" | awk '/minos/{print $2}' | sort -u)" = "11.0"
          codesign --verify --deep --strict "$bundle"

      - name: Stage VST3
        shell: bash
        run: |
          mkdir package
          cp -R "out/SuperformulaReverb_artefacts/Release/VST3/Superformula Reverb.vst3" package/
          cp README.md LICENSE NOTICE.md CHANGELOG.md package/

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path package/* -DestinationPath "${{ matrix.artifact }}.zip"

      - name: Create macOS archive
        if: runner.os == 'macOS'
        shell: bash
        run: cd package && zip -r "../${{ matrix.artifact }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/*.zip --clobber
            gh release edit "${GITHUB_REF_NAME}" --title "Superformula Reverb ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/*.zip --title "Superformula Reverb ${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md
          fi
